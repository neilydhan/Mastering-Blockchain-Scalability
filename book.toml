[book]
authors = ["Neil Han"]
language = "en"
src = "."
exclude = [".git/**", ".github/**", "book/**", "qa/**", "release/**", ".DS_Store"]
title = "Mastering Blockchain Scalability"
description = "A mechanism-first guide to blockchain scalability, security, trust, and recovery"

[output.html]
site-url = "/Mastering-Blockchain-Scalability/"
additional-css = ["theme/print.css"]
additional-js = ["theme/analytics.js"]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/neilydhan/Mastering-Blockchain-Scalability"
edit-url-template = "https://github.com/neilydhan/Mastering-Blockchain-Scalability/edit/main/{path}"
print = { enable = true }

[build]
build-dir = "book"

